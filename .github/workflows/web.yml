name: Deploy Web Version (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-web-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages_check.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages (auto-enable when permitted)
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Resolve Pages availability and base path
        id: pages_check
        run: |
          if [ "${{ steps.pages.outcome }}" = "success" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "web_base=${{ steps.pages.outputs.base_path }}/" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "web_base=./" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled on this repository (or requires a Public repo / GitHub Pro). Building a portable web bundle artifact instead."
          fi

      - name: Build Desktop & Mobile Web App
        env:
          VITE_WEB_BASE: ${{ steps.pages_check.outputs.web_base }}
        run: npm run build

      - name: Upload portable Web App bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-admin-web-dist
          path: dist

      - name: Upload Pages artifact
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Write build summary
        run: |
          if [ "${{ steps.pages_check.outputs.enabled }}" = "true" ]; then
            echo "## ✅ Web App Built & Ready for GitHub Pages" >> "$GITHUB_STEP_SUMMARY"
            echo "The web app was built and uploaded for deployment to GitHub Pages." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ✅ Portable Web App Built (GitHub Pages Not Enabled)" >> "$GITHUB_STEP_SUMMARY"
            echo "The web app built successfully and is attached as the \`school-admin-web-dist\` artifact." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### لتفعيل النشر المباشر على GitHub Pages:" >> "$GITHUB_STEP_SUMMARY"
            echo "1. افتح **Settings → Pages** في المستودع واختر **Source: GitHub Actions**." >> "$GITHUB_STEP_SUMMARY"
            echo "2. إذا كان المستودع خاصاً (**Private**) على خطة GitHub المجانية، اجعله عاماً (**Public**) أو نزّل ملف \`school-admin-web-dist\` واستضفه على أي استضافة ثابتة (Netlify / Cloudflare Pages / خادم محلي)." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
